<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathieu Ouillon</title>
  <meta name="description" content="Un cours de physique nucléaire construit en Python et des recettes de cuisine écrites en Gram.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2326231f'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' text-anchor='middle' fill='%23f7f5f0'%3EMO%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --fond: #f7f5f0;
      --encre: #26231f;
      --discret: #6b645a;
      --filet: #d9d3c5;
      --survol: #efebe2;
      --lien: #0b57b0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #16181c;
        --encre: #ece9e2;
        --discret: #a29c90;
        --filet: #31353d;
        --survol: #1d2026;
        --lien: #6ab0ff;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--fond);
      color: var(--encre);
      font: 1rem/1.6 Georgia, "Times New Roman", serif;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding: 5rem 1.25rem 2rem;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: 2.25rem;
      font-weight: 400;
      line-height: 1.15;
    }

    .intro,
    .desc,
    footer {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--discret);
    }

    .intro {
      margin: 0;
      font-size: 1rem;
    }

    .sommaire {
      margin: 2.5rem 0 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--filet);
    }

    .sommaire li {
      border-bottom: 1px solid var(--filet);
    }

    .ligne {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) auto;
      gap: 1.5rem;
      align-items: baseline;
      padding: 1.3rem 0.5rem;
      color: inherit;
      text-decoration: none;
    }

    .ligne:hover {
      background: var(--survol);
    }

    .ligne:hover .titre {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 6px;
    }

    .ligne:focus-visible {
      outline: 2px solid var(--lien);
      outline-offset: 2px;
    }

    .titre {
      font-size: 1.5rem;
      line-height: 1.25;
    }

    .desc {
      font-size: 0.95rem;
    }

    .fleche {
      font-size: 1.25rem;
    }

    footer {
      padding: 1.5rem 1.25rem 2rem;
      text-align: center;
      font-size: 0.9rem;
    }

    footer a {
      color: inherit;
    }

    @media (max-width: 38rem) {
      main { padding-top: 3rem; }
      h1 { font-size: 1.9rem; }
      .ligne { grid-template-columns: minmax(0, 1fr) auto; gap: 0.15rem 1rem; align-items: center; }
      .desc { grid-column: 1; grid-row: 2; }
      .fleche { grid-column: 2; grid-row: 1 / 3; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Mathieu Ouillon</h1>
    <p class="intro">Un cours de physique nucléaire et des recettes de cuisine.</p>

    <ul class="sommaire">
      <li>
        <a class="ligne" href="/du-noyau-au-reacteur/">
          <span class="titre">Du noyau au réacteur</span>
          <span class="desc">Physique nucléaire, calculée en Python</span>
          <span class="fleche" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="ligne" href="/recettes/">
          <span class="titre">Recettes</span>
          <span class="desc">Cuisine en français, écrite en Gram</span>
          <span class="fleche" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>
  </main>

  <footer>
    <a href="https://github.com/mathieuouillon">GitHub</a>
  </footer>
</body>
</html>
